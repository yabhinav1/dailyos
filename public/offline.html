<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0d0d0d" />
    <title>Offline · DailyOS</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px 16px;
        background: #0d0d0d;
        color: #e4e4e7;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      main { max-width: 380px; text-align: center; }
      img { width: 48px; height: 48px; }
      h1 { margin: 16px 0 8px; font-size: 18px; color: #fff; }
      p { margin: 0 0 20px; font-size: 13px; line-height: 1.6; color: #a1a1aa; }
      button {
        font: inherit;
        font-size: 13px;
        font-weight: 600;
        padding: 9px 18px;
        border-radius: 8px;
        border: 0;
        background: #fafafa;
        color: #18181b;
        cursor: pointer;
      }
      button:focus-visible { outline: 2px solid #3b82f6; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon.svg" alt="" />
      <h1>You're offline</h1>
      <p>DailyOS needs a connection to load this page. Anything you saved before going offline is safe. This page reloads by itself when you're back online.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
    <script>
      window.addEventListener("online", () => location.reload());
    </script>
  </body>
</html>
