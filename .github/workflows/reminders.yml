name: Morning reminders

# Vercel's free plan runs a cron at most once a day, which can only be
# morning in one time zone. This calls the reminders endpoint every hour;
# it sends each person's digest in their own 8am-noon window, once a day.
#
# Needs the repository secret SCHEDULER_SECRET, matching the variable of
# the same name in Vercel. Without it the job does nothing.
#
# GitHub pauses scheduled workflows in a public repository after 60 days
# without commits; re-enable it from the Actions tab if that happens.
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call the reminders endpoint
        env:
          SECRET: ${{ secrets.SCHEDULER_SECRET }}
          URL: https://dailyos.dpdns.org/api/cron/reminders
        run: |
          if [ -z "$SECRET" ]; then
            echo "SCHEDULER_SECRET is not set; skipping."
            exit 0
          fi
          curl --fail-with-body --silent --show-error --max-time 120 \
            -H "Authorization: Bearer $SECRET" "$URL"
